<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Knowledge Identity Verification</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        input { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #218838; }
        pre { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
        .hidden { display: none; }
    </style>
    <!-- Import the SnarkJS browser library -->
    <script src="https://unpkg.com/snarkjs@latest/build/snarkjs.min.js"></script>
</head>
<body>

    <div class="card">
        <h2>ZK Privacy Portal</h2>
        <p>Verify your eligibility without revealing your data.</p>
        
        <label for="age">Age (Must be 18+)</label>
        <input type="number" id="age" value="22">

        <label for="idNumber">National ID Number</label>
        <input type="number" id="idNumber" value="123456789">

        <button id="proveBtn" onclick="generateProof()">Generate ZK Proof Locally</button>
        <p id="status" style="text-align: center; color: #666;"></p>
    </div>

    <div class="card hidden" id="resultsCard" style="margin-top: 20px; max-width: 800px;">
        <h3>Cryptographic Proof Generated!</h3>
        <p>This is the only data that would be sent to the blockchain.</p>
        
        <h4>Hashed Identity (Public Signals)</h4>
        <pre id="publicOutput"></pre>

        <h4>Zero-Knowledge Proof (Groth16)</h4>
        <pre id="proofOutput"></pre>
    </div>

    <script src="app.js"></script>
</body>
</html>
